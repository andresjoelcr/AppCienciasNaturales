org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Evita error "Inconsistent JVM-target compatibility" en plugins como tflite_flutter
kotlin.jvm.target.validation.mode=warning
# AGP 9: permite el proguard-android.txt legacy usado por flutter_inappwebview
android.r8.proguardAndroidTxt.disallowed=false
# Evita error "different roots" de Kotlin (pub cache en C:, proyecto en D:)
kotlin.incremental=false

