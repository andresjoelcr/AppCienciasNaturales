name: mi_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2

  # UI
  google_fonts: ^6.1.0
  url_launcher: ^6.2.5
  youtube_player_flutter: ^9.1.1

  # Scanner
  image_picker: ^1.0.7
  google_generative_ai: ^0.4.6
  permission_handler: ^11.3.0

  # Image processing & TFLite for scanner
  image: ^4.1.7
  tflite_flutter: ^0.12.1

  # Camera for AR
  camera: ^0.11.0

  # Speech to Text
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/libro/
    - assets/celula/
    - assets/models/
    - assets/marcadores/
    - assets/glosario/