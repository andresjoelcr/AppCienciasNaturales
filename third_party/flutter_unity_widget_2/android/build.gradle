group 'com.xraph.plugin.flutter_unity_widget'
version '6000.0.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()

        // DO NOT MODIFY
        // BUILD_ADD_UNITY_LIBS

        // FOR DEV ONLY
        flatDir {
            dirs "libs"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34

    // backwards compatible for old gradle versions without namespace
    if (project.android.hasProperty("namespace")) {
        namespace 'com.xraph.plugin.flutter_unity_widget'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 23
    }
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
	
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}

def lifecycle_version = '2.4.1'
def annotation_version = '1.3.0'

dependencies {
    implementation project(':unityLibrary')
    implementation(name: 'unity-classes', ext:'jar')

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "androidx.lifecycle:lifecycle-common:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"
    implementation "androidx.annotation:annotation:$annotation_version"

    compileOnly rootProject.findProject(":flutter_plugin_android_lifecycle")

    // Parche local (third_party/): Unity 6000.3 usa
    // UnityPlayerGameActivity, que extiende androidx.games GameActivity.
    // Sin estas dependencias el plugin no compila con
    // "Cannot access 'GameActivity'/'AppCompatActivity' which is a supertype".
    // compileOnly: unityLibrary ya las empaqueta, no hay que duplicarlas.
    compileOnly 'androidx.games:games-activity:3.0.5'
    compileOnly 'androidx.appcompat:appcompat:1.6.1'
    compileOnly 'androidx.core:core:1.9.0'
    compileOnly 'androidx.constraintlayout:constraintlayout:2.1.4'

    // FOR DEV ONLY
//    implementation(name: 'flutter', ext:'jar')
}
